title: Math Notes
description: Comprehensive collection of example problems and solutions for eigenchris's theoretical physics lectures
baseurl: "/MathNotes"
url: "https://hpicsk.github.io"

# Jekyll theme
theme: minima

# Math rendering configuration
markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

# MathJax configuration
mathjax:
  source: https://polyfill.io/v3/polyfill.min.js?features=es6
  config: 'MathJax.tex2jax.inlineMath = [["$", "$"], ["\\(", "\\)"]]; MathJax.tex2jax.displayMath = [["$$", "$$"], ["\\[", "\\]"]];'

# GitHub Pages plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap